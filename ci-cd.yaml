name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Setup Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3️⃣ Install dependencies
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install ruff pytest

    # 4️⃣ Lint (Code Quality)
    - name: Run Linter (Ruff)
      run: |
        ruff check .

    # 5️⃣ Run Tests
    - name: Run Tests
      run: |
        pytest

    # 6️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t ml-dashboard .

    # 7️⃣ (Optional) Push to DockerHub
    # Requires login → can skip if not needed
    - name: Login to DockerHub
      run: echo "Skipping Docker push (optional)"

    # 8️⃣ Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        echo "kubectl apply -f k8s/"